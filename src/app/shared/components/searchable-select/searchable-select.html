<div class="relative w-full min-w-[170px]">
  <button type="button" (click)="toggle()"
    class="theme-input flex w-full items-center justify-between gap-2 rounded-xl border border-white/15 bg-white/5 px-3.5 py-2.5 text-left text-sm transition-all hover:bg-white/10">
    <span [ngClass]="value() !== null && value() !== '' ? 'theme-text-main font-medium' : 'theme-text-muted'" class="truncate">
      {{ selectedLabel() }}
    </span>
    <svg class="h-4 w-4 shrink-0 text-slate-400 transition-transform duration-200" [class.rotate-180]="isOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="absolute left-0 right-0 z-50 mt-2 overflow-hidden rounded-2xl border border-white/15 bg-[#132326] shadow-2xl animate-fade-up">
      <div class="border-b border-white/10 p-2">
        <input type="text" [ngModel]="query()" (ngModelChange)="query.set($event)" [placeholder]="searchPlaceholder()"
          class="theme-input theme-text-main w-full rounded-xl border border-white/15 bg-white/5 px-3 py-1.5 text-xs placeholder-slate-400 outline-none" />
      </div>
      <div class="max-h-52 overflow-y-auto p-1.5 space-y-0.5">
        @for (opt of filteredOptions(); track opt.value) {
          <button type="button" (click)="select(opt)"
            [ngClass]="isSelected(opt.value) ? 'theme-active-nav font-semibold' : 'theme-text-main hover:bg-white/10'"
            class="flex w-full items-center justify-between rounded-xl px-3 py-2 text-left text-xs transition-colors">
            <span class="truncate">{{ opt.label }}</span>
            @if (isSelected(opt.value)) {
              <svg class="h-3.5 w-3.5 shrink-0 text-teal-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            }
          </button>
        } @empty {
          <p class="px-3 py-3 text-center text-xs theme-text-muted">No matching options</p>
        }
      </div>
    </div>
  }
</div>
