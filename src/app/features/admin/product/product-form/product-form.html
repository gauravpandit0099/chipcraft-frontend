<div class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="theme-text-main font-display text-2xl font-bold">
        {{ editingId() ? 'Edit Product' : 'Add New Product' }}
      </h1>
      <p class="theme-text-muted text-sm">Configure gadget details, pricing, cover image, and gallery</p>
    </div>
    <a routerLink="/admin/products"
      class="rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-xs font-semibold theme-text-main hover:bg-white/10">
      &larr; Back to Products
    </a>
  </div>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
    <!-- left column: product info -->
    <div class="theme-card space-y-5 rounded-2xl border p-6 lg:col-span-7">
      <div>
        <label class="theme-text-muted mb-1.5 block text-xs font-semibold uppercase">Product Name</label>
        <input type="text" [(ngModel)]="name" placeholder="e.g. Chipcraft Pods Pro"
          class="theme-input theme-text-main w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm outline-none" />
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="theme-text-muted mb-1.5 block text-xs font-semibold uppercase">Category</label>
          <app-searchable-select [options]="categoryOptions" [value]="categoryId"
            placeholder="Select category..." searchPlaceholder="Search category..."
            (valueChange)="onCategoryChange($event)" />
        </div>
        <div>
          <label class="theme-text-muted mb-1.5 block text-xs font-semibold uppercase">Subcategory</label>
          <app-searchable-select [options]="subcategoryOptions" [value]="subcategoryId"
            placeholder="Select subcategory..." searchPlaceholder="Search subcategory..."
            (valueChange)="subcategoryId = +$event" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="theme-text-muted mb-1.5 block text-xs font-semibold uppercase">Price (₹)</label>
          <input type="number" [(ngModel)]="price" placeholder="4999"
            class="theme-input theme-text-main w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm outline-none" />
        </div>
        <div class="flex items-end pb-2">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" [(ngModel)]="inStock" class="h-4 w-4 rounded" />
            <span class="theme-text-main text-sm font-medium">Available In Stock</span>
          </label>
        </div>
      </div>

      <div>
        <label class="theme-text-muted mb-1.5 block text-xs font-semibold uppercase">Description</label>
        <textarea [(ngModel)]="description" rows="4" placeholder="Key specs, battery life, warranty..."
          class="theme-input theme-text-main w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm outline-none"></textarea>
      </div>
    </div>

    <!-- cover & gallery images -->
    <div class="theme-card space-y-5 rounded-2xl border p-6 lg:col-span-5">
      <div>
        <label class="theme-text-muted mb-2 block text-xs font-semibold uppercase">Cover Image</label>
        <label class="flex h-44 cursor-pointer flex-col items-center justify-center overflow-hidden rounded-2xl border-2 border-dashed border-white/20 bg-white/5 transition-all hover:border-teal-400/50">
          @if (coverPreview()) {
            <img [src]="coverPreview()" alt="Cover preview" class="h-full w-full object-contain p-2" />
          } @else {
            <span class="theme-text-muted text-xs font-semibold">Click to upload cover image</span>
          }
          <input type="file" accept="image/*" (change)="onCoverSelect($event)" class="hidden" />
        </label>
      </div>

      <div>
        <label class="theme-text-muted mb-2 block text-xs font-semibold uppercase">Gallery Images</label>
        <label class="flex cursor-pointer items-center justify-center rounded-xl border border-dashed border-white/20 bg-white/5 py-3 text-xs font-semibold theme-link hover:bg-white/10">
          + Upload Additional Photos
          <input type="file" accept="image/*" multiple (change)="onGallerySelect($event)" class="hidden" />
        </label>
        <div class="mt-3 grid grid-cols-4 gap-2.5">
          @for (img of existingGallery(); track img.path; let i = $index) {
            <div class="group relative h-16 overflow-hidden rounded-xl border border-white/15 bg-white/5">
              <img [src]="img.url" class="h-full w-full object-contain p-1" />
              <button type="button" (click)="removeExistingGallery(i)" title="Remove image"
                class="absolute right-1 top-1 flex h-5 w-5 items-center justify-center rounded-full bg-rose-600 text-[10px] font-bold text-white shadow hover:bg-rose-700">
                ✕
              </button>
            </div>
          }
          @for (img of galleryPreviews(); track img; let i = $index) {
            <div class="group relative h-16 overflow-hidden rounded-xl border border-teal-400/50 bg-white/5">
              <img [src]="img" class="h-full w-full object-contain p-1" />
              <button type="button" (click)="removeNewGallery(i)" title="Remove image"
                class="absolute right-1 top-1 flex h-5 w-5 items-center justify-center rounded-full bg-rose-600 text-[10px] font-bold text-white shadow hover:bg-rose-700">
                ✕
              </button>
            </div>
          }
        </div>
      </div>

      <button type="button" [disabled]="saving()" (click)="saveProduct()"
        class="theme-btn-primary w-full rounded-xl py-3 text-sm font-semibold shadow-lg transition-all disabled:opacity-60">
        {{ saving() ? 'Saving Product...' : (editingId() ? 'Update Product' : 'Create Product') }}
      </button>
    </div>
  </div>
</div>
