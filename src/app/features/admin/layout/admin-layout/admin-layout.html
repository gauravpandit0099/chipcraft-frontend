<div class="theme-page-bg min-h-screen">
  <!-- fixed non-scrollable sidebar -->
  <aside [class.translate-x-0]="sidebarOpen()" [class.-translate-x-full]="!sidebarOpen()"
    class="theme-sidebar fixed inset-y-0 left-0 z-40 flex h-screen w-64 flex-col justify-between overflow-hidden p-5 text-white shadow-xl transition-transform duration-300 md:translate-x-0">
    <div>
      <div class="flex items-center justify-between pb-6 border-b border-white/10">
        <div class="flex items-center gap-2.5">
          <span class="theme-brand-panel flex h-9 w-9 items-center justify-center rounded-xl text-white shadow-md">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
          </span>
          <h2 class="font-display text-xl font-bold tracking-tight text-white">Chipcraft</h2>
        </div>
        <button type="button" (click)="toggleSidebar()" class="md:hidden text-white/75 hover:text-white">✕</button>
      </div>
      <nav class="mt-6 space-y-1.5">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="theme-active-nav shadow-md"
            class="flex items-center rounded-xl px-4 py-2.5 text-sm font-medium text-white/70 transition-all duration-150 hover:bg-white/10 hover:text-white">
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
    <div class="pt-4 border-t border-white/10 text-center">
      <p class="text-xs font-semibold text-white/80">Chipcraft Electronics</p>
      <p class="mt-0.5 text-[11px] text-white/50">&copy; {{ currentYear }} All rights reserved.</p>
    </div>
  </aside>

  <!-- main content offset by fixed sidebar -->
  <div class="flex min-h-screen flex-col md:pl-64">
    <header class="sticky top-0 z-30 flex items-center justify-between gap-4 border-b border-white/10 bg-[#132326]/75 px-6 py-3.5 backdrop-blur-xl">
      <div class="flex items-center gap-3 flex-1 max-w-md">
        <button type="button" (click)="toggleSidebar()" class="rounded-lg border border-white/15 p-2 text-white/80 md:hidden">☰</button>
        <div class="relative w-full hidden sm:block">
          <input type="text" placeholder="Search anything..."
            class="theme-input theme-text-main w-full rounded-xl border border-white/15 bg-white/5 pl-10 pr-4 py-2 text-sm placeholder-slate-400 outline-none transition-all" />
          <svg class="pointer-events-none absolute left-3 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- profile dropdown -->
      <div class="relative">
        <button type="button" (click)="toggleDropdown()"
          class="flex items-center gap-2.5 rounded-full border border-white/15 bg-white/10 px-3 py-1.5 shadow-sm transition-all hover:bg-white/15">
          <span class="theme-brand-panel flex h-7 w-7 items-center justify-center rounded-full text-xs font-bold text-white">
            {{ adminName.slice(0, 1).toUpperCase() }}
          </span>
          <span class="theme-text-main text-xs font-semibold">{{ adminName }}</span>
          <svg class="h-3.5 w-3.5 text-slate-300 transition-transform duration-200" [class.rotate-180]="dropdownOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        @if (dropdownOpen()) {
          <div class="absolute right-0 mt-2 w-48 overflow-hidden rounded-2xl border border-white/15 bg-[#162a2e]/95 py-1.5 shadow-2xl backdrop-blur-xl animate-fade-up">
            <a routerLink="/admin/profile" (click)="dropdownOpen.set(false)"
              class="theme-text-main flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium transition-colors hover:bg-white/10">
              Profile
            </a>
            <a routerLink="/admin/settings" (click)="dropdownOpen.set(false)"
              class="theme-text-main flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium transition-colors hover:bg-white/10">
              Settings
            </a>
            <div class="my-1 border-t border-white/10"></div>
            <button type="button" (click)="logout()" [disabled]="loggingOut()"
              class="flex w-full items-center gap-2.5 px-4 py-2.5 text-left text-sm font-semibold text-rose-400 transition-colors hover:bg-rose-500/10 disabled:cursor-not-allowed disabled:opacity-60">
              @if (loggingOut()) {
                <svg class="h-4 w-4 animate-spin text-rose-400" viewBox="0 0 24 24" fill="none">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                <span>Logging out...</span>
              } @else {
                <span>Logout</span>
              }
            </button>
          </div>
        }
      </div>
    </header>

    <main class="flex-1 p-6 animate-fade-up">
      <router-outlet />
    </main>
  </div>
</div>
