<div class="min-h-screen bg-slate-50 flex">
  <aside
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
    class="theme-brand-panel fixed inset-y-0 left-0 z-40 w-64 text-white transition-transform duration-300 md:static md:translate-x-0 flex flex-col justify-between p-6 shadow-xl"
  >
    <div>
      <div class="flex items-center justify-between pb-6 border-b border-white/15">
        <div>
          <span class="text-xs font-semibold uppercase tracking-widest text-white/75"
            >Admin Portal</span
          >
          <h2 class="font-display text-xl font-bold tracking-tight text-white">Chipcraft</h2>
        </div>
        <button
          type="button"
          (click)="toggleSidebar()"
          class="md:hidden text-white/80 hover:text-white"
        >
          ✕
        </button>
      </div>
      <nav class="mt-6 space-y-1.5">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-white/20 text-white shadow-sm"
            class="flex items-center rounded-xl px-4 py-2.5 text-sm font-medium text-white/80 transition-all duration-150 hover:bg-white/10 hover:text-white"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
    <div class="pt-4 border-t border-white/15">
      <p class="text-xs text-white/75 mb-3">
        Signed in as <strong class="text-white">{{ adminName }}</strong>
      </p>
      <button
        type="button"
        (click)="logout()"
        class="w-full rounded-xl bg-white/15 py-2.5 text-sm font-semibold text-white transition-all hover:bg-white/25"
      >
        Logout
      </button>
    </div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header
      class="sticky top-0 z-30 flex items-center justify-between border-b border-slate-200/80 bg-white/80 px-6 py-4 backdrop-blur-md"
    >
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="toggleSidebar()"
          class="rounded-lg border border-slate-200 p-2 text-slate-600 md:hidden"
        >
          ☰
        </button>
        <h1 class="theme-text-main font-display text-lg font-bold">Store Overview</h1>
      </div>
      <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold theme-link"
        >Single-Vendor Mode</span
      >
    </header>
    <main class="flex-1 p-6 animate-fade-up">
      <router-outlet />
    </main>
  </div>
</div>
