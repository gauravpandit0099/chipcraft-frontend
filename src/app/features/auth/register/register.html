<div
  class="theme-auth-bg relative min-h-screen flex items-center justify-center overflow-hidden px-4 py-10"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(56,189,248,0.22),_transparent_45%),radial-gradient(circle_at_bottom_left,_rgba(99,102,241,0.28),_transparent_50%)]"
  ></div>
  <div
    class="pointer-events-none absolute -top-24 -right-20 h-96 w-96 rounded-full bg-indigo-500/25 blur-3xl animate-float"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-24 -left-20 h-96 w-96 rounded-full bg-sky-500/25 blur-3xl animate-float-delay"
  ></div>
  <svg
    class="pointer-events-none absolute bottom-0 left-0 w-full opacity-20"
    viewBox="0 0 1440 220"
    fill="none"
  >
    <path d="M0,128 C320,220 1120,20 1440,128 L1440,220 L0,220 Z" fill="url(#regWaveGrad)" />
    <defs>
      <linearGradient
        id="regWaveGrad"
        x1="0"
        y1="0"
        x2="1440"
        y2="0"
        gradientUnits="userSpaceOnUse"
      >
        <stop stop-color="var(--brand-from)" />
        <stop offset="1" stop-color="var(--brand-to)" />
      </linearGradient>
    </defs>
  </svg>
  <div
    class="relative z-10 grid w-full max-w-4xl overflow-hidden rounded-[2rem] border border-white/15 bg-white/10 shadow-2xl shadow-black/50 backdrop-blur-2xl md:grid-cols-12 animate-fade-up"
  >
    <div
      class="theme-brand-panel relative hidden flex-col justify-between overflow-hidden p-10 text-white md:col-span-5 md:flex rounded-r-[3rem]"
    >
      <div
        class="pointer-events-none absolute -right-12 -top-12 h-44 w-44 rounded-full border border-white/20 bg-white/5"
      ></div>
      <div
        class="pointer-events-none absolute -bottom-16 -left-12 h-52 w-52 rounded-full border border-white/15 bg-white/5"
      ></div>
      <div>
        <span
          class="inline-flex items-center gap-2 rounded-full bg-white/15 px-3.5 py-1 text-xs font-semibold tracking-wider uppercase backdrop-blur-md"
        >
          <span class="h-2 w-2 rounded-full bg-sky-300 animate-ping"></span> Chipcraft Store
        </span>
        <h2 class="mt-6 text-3xl font-bold leading-tight tracking-tight">
          Join Chipcraft Electronics.
        </h2>
        <p class="mt-3 text-sm leading-relaxed text-white/85">
          Save wishlists, apply exclusive coupon offers, and track every gadget order in real time.
        </p>
      </div>
      <div class="rounded-2xl border border-white/15 bg-white/10 p-4 backdrop-blur-md">
        <p class="text-xs font-medium text-white">Instant Account Setup</p>
        <p class="mt-1 text-[11px] text-white/80">Protected checkout &amp; order history</p>
      </div>
    </div>
    <div class="theme-card p-8 sm:p-10 md:col-span-7">
      <div class="mb-6">
        <span
          class="theme-link inline-block rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold md:hidden"
          >Chipcraft</span
        >
        <h1 class="theme-text-main mt-2 text-2xl font-bold tracking-tight">Create your account</h1>
        <p class="theme-text-muted mt-1 text-sm">Fill in your details to get started</p>
      </div>
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="relative">
          <input
            type="text"
            id="regName"
            name="name"
            [(ngModel)]="form.name"
            placeholder=" "
            required
            class="peer theme-input theme-text-main w-full rounded-2xl border border-slate-200 bg-slate-50/70 pl-11 pr-4 pt-5 pb-2 text-sm outline-none transition-all duration-200 focus:bg-white"
          />
          <label
            for="regName"
            class="theme-label pointer-events-none absolute left-11 top-2 text-[11px] font-semibold transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-semibold"
          >
            Full Name
          </label>
          <svg
            class="theme-icon pointer-events-none absolute left-3.5 top-3.5 h-5 w-5 text-slate-400 transition-colors"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
        <div class="relative">
          <input
            type="email"
            id="regEmail"
            name="email"
            [(ngModel)]="form.email"
            placeholder=" "
            required
            class="peer theme-input theme-text-main w-full rounded-2xl border border-slate-200 bg-slate-50/70 pl-11 pr-4 pt-5 pb-2 text-sm outline-none transition-all duration-200 focus:bg-white"
          />
          <label
            for="regEmail"
            class="theme-label pointer-events-none absolute left-11 top-2 text-[11px] font-semibold transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-semibold"
          >
            Email Address
          </label>
          <svg
            class="theme-icon pointer-events-none absolute left-3.5 top-3.5 h-5 w-5 text-slate-400 transition-colors"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="relative">
            <input
              type="password"
              id="regPassword"
              name="password"
              [(ngModel)]="form.password"
              placeholder=" "
              required
              class="peer theme-input theme-text-main w-full rounded-2xl border border-slate-200 bg-slate-50/70 pl-11 pr-4 pt-5 pb-2 text-sm outline-none transition-all duration-200 focus:bg-white"
            />
            <label
              for="regPassword"
              class="theme-label pointer-events-none absolute left-11 top-2 text-[11px] font-semibold transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-semibold"
            >
              Password (6+ chars)
            </label>
            <svg
              class="theme-icon pointer-events-none absolute left-3.5 top-3.5 h-5 w-5 text-slate-400 transition-colors"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
          </div>
          <div class="relative">
            <input
              type="text"
              id="regPhone"
              name="phone"
              [(ngModel)]="form.phone"
              placeholder=" "
              class="peer theme-input theme-text-main w-full rounded-2xl border border-slate-200 bg-slate-50/70 pl-11 pr-4 pt-5 pb-2 text-sm outline-none transition-all duration-200 focus:bg-white"
            />
            <label
              for="regPhone"
              class="theme-label pointer-events-none absolute left-11 top-2 text-[11px] font-semibold transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-semibold"
            >
              Phone (Optional)
            </label>
            <svg
              class="theme-icon pointer-events-none absolute left-3.5 top-3.5 h-5 w-5 text-slate-400 transition-colors"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
              />
            </svg>
          </div>
        </div>
        <div class="relative">
          <textarea
            id="regAddress"
            name="address"
            [(ngModel)]="form.address"
            rows="2"
            placeholder=" "
            class="peer theme-input theme-text-main w-full rounded-2xl border border-slate-200 bg-slate-50/70 pl-11 pr-4 pt-5 pb-2 text-sm outline-none transition-all duration-200 focus:bg-white"
          ></textarea>
          <label
            for="regAddress"
            class="theme-label pointer-events-none absolute left-11 top-2 text-[11px] font-semibold transition-all duration-200 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-semibold"
          >
            Shipping Address (Optional)
          </label>
          <svg
            class="theme-icon pointer-events-none absolute left-3.5 top-3.5 h-5 w-5 text-slate-400 transition-colors"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </div>
        <button
          type="submit"
          [disabled]="loading"
          class="theme-btn-primary w-full rounded-2xl py-3.5 text-sm font-semibold shadow-lg transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>
      <p class="theme-text-muted mt-5 text-center text-sm">
        Already have an account?
        <a routerLink="/login" class="theme-link font-semibold transition-colors">Sign in</a>
      </p>
    </div>
  </div>
</div>
